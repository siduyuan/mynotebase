# Notebase 服务 (snb) - 独立配置
# 端口：60813
# 域名：snb.sdy666.icu, snb.sdy20h.cn, snb.siduyuan.dpdns.org, snb.sdy.qzz.io
server {
    listen 2052;
    listen [::]:2052;

    server_name snb.sdy666.icu
                snb.sdy20h.cn
                snb.siduyuan.dpdns.org
                snb.sdy.qzz.io;

    absolute_redirect off;

    access_log /var/log/nginx/snb-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/snb-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:60813;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 禁止访问敏感文件
    location ~ /\.(git|htaccess|htpasswd|env) {
        deny all;
        return 404;
    }
}